# Runs the tests on Windows and Linux. Windows is the first supported target and
# the one this code was NOT exercised on during the WSL port, so a red Windows job
# on the first run is expected information, not a surprise.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false          # one OS failing must not hide the other's result
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"           # the tests print non-ASCII; the Windows default code page cannot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (PyTorch is optional and not installed)
        run: python -m pip install -r requirements.txt
      - name: Platform layer tests
        run: python -m unittest test_platform_compat -v
      - name: Adversarial suite
        run: python -m unittest test_adversarial -v
